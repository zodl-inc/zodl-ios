name: Pull Request

on:
  pull_request:
    # Include ready_for_review so flipping a draft PR to "Ready for review"
    # re-triggers CI. The default activity types are opened/synchronize/
    # reopened only, so without this the draft-skipped job below would never
    # run until the next push.
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - '.github/ISSUE_TEMPLATE/*'
      - '.github/pull_request_template.md'
      - 'LICENSE'
      - 'README.md'
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FX_ENABLE_GLASS: "0"
  DERIVED_DATA_PATH: .ci/DerivedData
  SOURCE_PACKAGES_PATH: .ci/DerivedData/SourcePackages

jobs:
  validate_sdk_pin:
    # Cheap gate: an invalid .sdk-pin fails here in seconds instead of
    # burning two macOS jobs. Same draft guard as unit_tests, except release
    # PRs: their candidate content ships to users before the PR merges, so a
    # draft release PR gets full CI on every push while its draft state
    # keeps guarding the merge.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false || startsWith(github.base_ref, 'release/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.companion.outputs.mode }}
      pin: ${{ steps.companion.outputs.pin }}
      sdk_path: ${{ steps.companion.outputs.sdk_path }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate SDK pin
        id: companion
        uses: ./.github/actions/setup-sdk-companion
        with:
          validate-only: 'true'

  build_ffi:
    # Builds the SDK's Rust core (libzcashlc) once per push, shared with the
    # e2e workflow through the product cache. Runs only when the project
    # references a local SDK. The product cache is keyed on the FFI input
    # tree at the pin, so re-runs and Swift-only SDK bumps finish in seconds.
    needs: validate_sdk_pin
    if: ${{ needs.validate_sdk_pin.outputs.mode == 'local' }}
    runs-on: macos-26
    # Cold cargo compile of the FFI graph (orchard, tor, ...) runs 20-30 min.
    timeout-minutes: 45
    concurrency:
      # Serialize with the e2e workflow's twin job on the same push: the
      # second job waits, then finds the product cache warm.
      group: build-ffi-${{ github.event.pull_request.head.sha || github.sha }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fetch SDK at the pinned commit
        id: companion
        uses: ./.github/actions/setup-sdk-companion
      - name: Compute FFI cache keys
        id: keys
        run: |
          set -o pipefail
          SDK="${{ steps.companion.outputs.sdk_abs_path }}"
          RUST_TREE=$(git -C "$SDK" rev-parse "HEAD:rust")
          SCRIPT_TREE=$(git -C "$SDK" rev-parse "HEAD:Scripts/init-local-ffi.sh")
          CARGO_HASH=$(shasum -a 256 "$SDK/Cargo.toml" "$SDK/Cargo.lock" | shasum -a 256 | awk '{print $1}')
          if grep -q -- '--arm-simulator' "$SDK/Scripts/init-local-ffi.sh"; then
            SLICE=arm-simulator
          else
            SLICE=arm-ios
          fi
          echo "slice=$SLICE" >> "$GITHUB_OUTPUT"
          echo "product=${{ runner.os }}-ffi-product-$SLICE-$RUST_TREE-$SCRIPT_TREE-$CARGO_HASH" >> "$GITHUB_OUTPUT"
          echo "cargo=${{ runner.os }}-ffi-cargo-$(shasum -a 256 "$SDK/Cargo.lock" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - name: Restore built FFI (product cache)
        id: product-cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.companion.outputs.sdk_abs_path }}/LocalPackages
          key: ${{ steps.keys.outputs.product }}
      - name: Restore cargo cache
        if: steps.product-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ steps.companion.outputs.sdk_abs_path }}/target
          key: ${{ steps.keys.outputs.cargo }}
          restore-keys: |
            ${{ runner.os }}-ffi-cargo-
      - name: Build FFI XCFramework
        if: steps.product-cache.outputs.cache-hit != 'true'
        run: |
          if ! command -v rustup > /dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          fi
          source "$HOME/.cargo/env"
          rustup target add aarch64-apple-ios-sim aarch64-apple-ios
          cd "${{ steps.companion.outputs.sdk_abs_path }}"
          ./Scripts/init-local-ffi.sh --${{ steps.keys.outputs.slice }}
      - name: Upload FFI LocalPackages
        uses: actions/upload-artifact@v4
        with:
          name: ffi-localpackages
          path: ${{ steps.companion.outputs.sdk_abs_path }}/LocalPackages
          retention-days: 1
          if-no-files-found: error

  shellcheck:
    # Lints every script under Scripts/, which is what this repo's shell
    # tooling is. The root symlink-templates.sh is deliberately NOT covered:
    # it predates this job and has a real finding (SC2148, no shebang), and
    # fixing it belongs to whoever owns that script, not to a recovery PR.
    #
    # -x follows sourced files. SC1091 is excluded because the two SDK-pin
    # scripts source through "$SCRIPT_DIR/...", which shellcheck cannot
    # resolve statically; that is the ONLY check relaxed, so everything else
    # stays at full strictness.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Lint shell scripts
        run: shellcheck -x -e SC1091 $(find Scripts -name '*.sh' | sort)

  unit_tests:
    # Skip draft PRs — no tests run until a PR is marked ready for review —
    # except release PRs, which are tested while still draft
    # (matches the e2e/smoke suite guard in e2e-smoke.yml).
    needs: [validate_sdk_pin, build_ffi]
    # build_ffi is skipped in remote mode; accept success OR skipped. The draft guard lives on validate_sdk_pin and propagates through needs.
    if: ${{ !cancelled() && needs.validate_sdk_pin.result == 'success' && (needs.build_ffi.result == 'success' || needs.build_ffi.result == 'skipped') }}
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up SDK companion
        id: companion
        uses: ./.github/actions/setup-sdk-companion
      - name: Download built FFI (local SDK mode)
        if: needs.validate_sdk_pin.outputs.mode == 'local'
        uses: actions/download-artifact@v4
        with:
          name: ffi-localpackages
          path: ${{ steps.companion.outputs.sdk_abs_path }}/LocalPackages

      - name: Select Xcode (pinned, avoiding iOS 26.5 driver bug)
        # macos-26 runners ship multiple Xcodes; default-selected is 16.x
        # (Swift 6.0). The project is SWIFT_VERSION=6.0, and Swift 6.0 treats
        # some concurrency diagnostics as errors that 6.2+ relaxed back to
        # warnings ("Approachable Concurrency"). Without a pin CI fails on
        # call sites that compile fine in newer Xcode locally — so pin to
        # Xcode 26.3, which is new enough for that, but ships the iOS 26.2
        # Simulator runtime rather than iOS 26.5. Xcode 26.5/26.6 both ship
        # iOS 26.5, which has a confirmed Maestro/XCUITest driver-stability
        # bug (repeated e2e-smoke driver crashes/hangs; see
        # mobile-dev-inc/maestro#3318, #3254) that 26.3's older runtime
        # sidesteps. Falls back to newest-available-with-iOS-runtime if
        # 26.3 isn't on this runner image.
        run: |
          PINNED="/Applications/Xcode_26.3.app"
          if [ -d "$PINNED" ]; then
            sudo xcode-select -s "$PINNED/Contents/Developer"
            echo "Selecting pinned $PINNED"
          else
            echo "::warning::Pinned Xcode 26.3 not found on this runner image, falling back to newest with an iOS runtime"
            for XCODE in $(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -Vr); do
              sudo xcode-select -s "$XCODE/Contents/Developer"
              if xcrun simctl list runtimes available | grep -q 'iOS'; then
                echo "Selecting $XCODE"
                break
              fi
            done
          fi
          xcrun simctl list runtimes available | grep -q 'iOS' || { echo '::error::No installed iOS Simulator runtime'; exit 1; }
          xcodebuild -version

      - name: Compute Xcode cache key
        id: xcode-cache-key
        run: |
          xcodebuild -version
          xcodebuild -version | shasum -a 256 | awk '{ print "hash="$1 }' >> "$GITHUB_OUTPUT"

      - name: Restore Swift package cache
        id: spm-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.SOURCE_PACKAGES_PATH }}
          key: ${{ runner.os }}-${{ runner.arch }}-xcode-spm-${{ steps.xcode-cache-key.outputs.hash }}-${{ hashFiles('secant.xcodeproj/project.pbxproj', 'secant.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', '.sdk-pin') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-xcode-spm-${{ steps.xcode-cache-key.outputs.hash }}-
            ${{ runner.os }}-${{ runner.arch }}-xcode-spm-

      - name: Resolve packages
        run: |
          for attempt in 1 2 3; do
            xcodebuild -project secant.xcodeproj \
              -scheme zodl-internal \
              -resolvePackageDependencies \
              -derivedDataPath "$DERIVED_DATA_PATH" \
              -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_PATH" && break
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            echo "::warning::Xcode package resolution failed on attempt $attempt; retrying."
          done

      - name: Save Swift package cache
        if: ${{ steps.spm-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: ${{ env.SOURCE_PACKAGES_PATH }}
          key: ${{ steps.spm-cache.outputs.cache-primary-key }}

      - name: Run unit tests
        run: |
          set -o pipefail
          # Use xcbeautify, not xcpretty: xcpretty does not understand Swift
          # Testing output and silently drops it, so a failing `@Test` never
          # shows up in the log (only the XCTest subset does). Pre-installed on
          # the macos runner image; guard-install just in case it ever isn't.
          command -v xcbeautify >/dev/null 2>&1 || brew install xcbeautify
          xcodebuild test \
            -project secant.xcodeproj \
            -scheme zodl-internal \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -resultBundlePath TestResults.xcresult \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_PATH" \
            -only-testing:zodlTests \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            COMPILER_INDEX_STORE_ENABLE=NO \
            DEBUG_INFORMATION_FORMAT=dwarf \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify

      - name: Run delegation recovery end-to-end
        run: |
          # Drives the app's LAUNCH action on a booted simulator against a
          # corrupted voting database, and asserts the delegation secrets the
          # user broadcast are in the escrow afterwards.
          #
          # Not covered by the unit tests above: recovery has no user-facing
          # trigger, so the thing most worth protecting is that opening the app
          # is what sets it going. A change that unhooked it from launch would
          # leave every other test green.
          #
          # Reuses this job's derived data and resolved packages, so it does
          # not build or resolve a second copy.
          DERIVED="$DERIVED_DATA_PATH" \
          SOURCE_PACKAGES="$SOURCE_PACKAGES_PATH" \
            ./Scripts/e2e/run-delegation-recovery-e2e.sh -d 'iPhone 17'

      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult
