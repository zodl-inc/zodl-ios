# Restrict only the credential paths listed below.
# Select zodl-secrets in the app's permissions menu for existing tasks.
# Legacy sandbox_mode settings and --sandbox override default_permissions.
default_permissions = "zodl-secrets"

[permissions.zodl-secrets]
description = "Filesystem and network access with Zodl credential files blocked."

[permissions.zodl-secrets.filesystem]
":root" = "write"

[permissions.zodl-secrets.filesystem.":workspace_roots"]
"secant/Resources/PartnerKeys.plist" = "deny"
"fastlane/.env" = "deny"
"fastlane/**/*.p8" = "deny"

[permissions.zodl-secrets.network]
enabled = true
